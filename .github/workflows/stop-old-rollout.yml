name: Stop outdated AI folder rollout
on:
  push:
    branches: [bulk-ai-invite-20261016]
    paths: ['.github/workflows/stop-old-rollout.yml']
permissions:
  actions: write
  contents: read
jobs:
  stop-old:
    runs-on: ubuntu-latest
    steps:
      - name: Request cancellation of obsolete rollout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS --retry 3 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/38879361009/cancel"
