name: Verify encrypted result delivery
run-name: quark-test:${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request identifier
        type: string
        required: true
      result_public_key:
        description: Ephemeral RSA public key for the encrypted response
        type: string
        required: true
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUARK_REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Initialize private runtime directories
        run: |
          umask 077
          echo "QUARK_RESULT_DIR=$RUNNER_TEMP/quark-result" >> "$GITHUB_ENV"
          echo "QUARK_ENCRYPTED_DIR=$RUNNER_TEMP/quark-encrypted" >> "$GITHUB_ENV"
      - name: Create a non-user test document
        run: |
          node - <<'JS'
          const fs=require('node:fs'),path=require('node:path');
          const root=process.env.QUARK_RESULT_DIR;
          fs.mkdirSync(root,{recursive:true,mode:0o700});
          fs.writeFileSync(path.join(root,'001.md'),'# Encrypted GitHub delivery test\n');
          fs.writeFileSync(path.join(root,'manifest.json'),JSON.stringify({status:'complete',files:[{name:'test.md',result_file:'001.md'}]}));
          JS
      - name: Encrypt result for the requesting Agent
        if: always()
        env:
          QUARK_RESULT_PUBLIC_KEY: ${{ inputs.result_public_key }}
        run: node scripts/crypto.cjs encrypt-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quark-test-${{ inputs.request_id }}
          path: ${{ runner.temp }}/quark-encrypted/encrypted-result.json
          retention-days: 1
          if-no-files-found: ignore
