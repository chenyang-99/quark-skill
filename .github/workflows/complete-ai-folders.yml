name: Sharded AI folder completion
on:
  push:
    branches: [ai-save-time-sharded-20261016]
    paths: ['.github/workflows/complete-ai-folders.yml']
permissions:
  contents: write
concurrency:
  group: ai-folder-sharded
  cancel-in-progress: false
jobs:
  expand:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CODEX_CI: '1'
      SHARD: ${{ matrix.shard }}
      SHARDS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install fixed Quark CLI
        run: bash scripts/bootstrap.sh
      - name: Restore existing encrypted account authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUARK_STATE_KEY: ${{ secrets.QUARK_STATE_KEY }}
        run: node --use-env-proxy scripts/state.cjs restore
      - name: Create directories in selected shard
        run: node scripts/sharded-bulk-ai-folder.cjs
      - name: Persist refreshed encrypted authorization
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUARK_STATE_KEY: ${{ secrets.QUARK_STATE_KEY }}
        run: node --use-env-proxy scripts/state.cjs save
      - name: Store sanitized shard totals
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const p='bulk-status-'+process.env.SHARD+'.json';
          let data={status:'failed-before-run',shard:Number(process.env.SHARD)};
          try{data=JSON.parse(fs.readFileSync(p,'utf8'))}catch{}
          const url='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+p;
          for(let n=0;n<7;n++){
            const present=await fetch(url+'?ref='+process.env.GITHUB_REF_NAME,{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'}});
            const prev=present.ok?await present.json():null;
            const body={message:'Record shard '+process.env.SHARD+' directory counts',branch:process.env.GITHUB_REF_NAME,content:Buffer.from(JSON.stringify(data)).toString('base64'),...(prev?{sha:prev.sha}:{})};
            const resp=await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'},body:JSON.stringify(body)});
            if(resp.ok)break;
            if(n===6)throw Error('Could not store shard statistics: '+resp.status);
            await new Promise(resolve=>setTimeout(resolve,2000*(n+1)));
          }
          JS
