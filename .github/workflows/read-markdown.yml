name: Read Quark Markdown
run-name: quark-md:${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      encrypted_request:
        description: Encrypted filename keyword and read options
        type: string
        required: true
      request_id:
        description: Unique request identifier generated by the Agent
        type: string
        required: true
      result_public_key:
        description: Ephemeral RSA public key for the encrypted response
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: quark-drive-account
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_CI: '1'
      QUARK_REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Initialize private runtime directories
        run: |
          umask 077
          echo "QUARK_RESULT_DIR=$RUNNER_TEMP/quark-result" >> "$GITHUB_ENV"
          echo "QUARK_ENCRYPTED_DIR=$RUNNER_TEMP/quark-encrypted" >> "$GITHUB_ENV"
      - name: Install official runtime
        run: bash scripts/bootstrap.sh
      - name: Restore encrypted authorization
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUARK_STATE_KEY: ${{ secrets.QUARK_STATE_KEY }}
        run: node --use-env-proxy scripts/state.cjs restore
      - name: Read matching Markdown files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUARK_STATE_KEY: ${{ secrets.QUARK_STATE_KEY }}
          QUARK_ENCRYPTED_REQUEST: ${{ inputs.encrypted_request }}
        run: node --use-env-proxy scripts/execute-request.cjs read
      - name: Persist refreshed authorization
        if: always() && steps.restore.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUARK_STATE_KEY: ${{ secrets.QUARK_STATE_KEY }}
        run: node --use-env-proxy scripts/state.cjs save
      - name: Encrypt result for the requesting Agent
        if: always()
        env:
          QUARK_RESULT_PUBLIC_KEY: ${{ inputs.result_public_key }}
        run: node scripts/crypto.cjs encrypt-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quark-markdown-${{ inputs.request_id }}
          path: ${{ runner.temp }}/quark-encrypted/encrypted-result.json
          retention-days: 1
          if-no-files-found: ignore
