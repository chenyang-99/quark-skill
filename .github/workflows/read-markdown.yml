name: Read Quark Markdown
run-name: quark-md:${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: The user's Markdown filename keyword (1–50 characters)
        type: string
        required: true
      max_files:
        description: Maximum number of matching Markdown files (1–20)
        type: string
        default: '5'
      request_id:
        description: Unique request identifier generated by the Agent
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: quark-drive-account
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_CI: '1'
      QUARK_RESULT_DIR: ${{ runner.temp }}/quark-result
    steps:
      - name: Require a private repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install official runtime
        run: bash scripts/bootstrap.sh
      - name: Restore encrypted authorization
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUARK_STATE_KEY: ${{ secrets.QUARK_STATE_KEY }}
        run: node --use-env-proxy scripts/state.cjs restore
      - name: Read matching Markdown files
        id: read
        env:
          QUARK_KEYWORD: ${{ inputs.keyword }}
          QUARK_MAX_FILES: ${{ inputs.max_files }}
          QUARK_REQUEST_ID: ${{ inputs.request_id }}
        run: node --use-env-proxy scripts/task.cjs read
      - name: Persist refreshed authorization
        if: always() && steps.restore.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUARK_STATE_KEY: ${{ secrets.QUARK_STATE_KEY }}
        run: node --use-env-proxy scripts/state.cjs save
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quark-markdown-${{ inputs.request_id }}
          path: ${{ runner.temp }}/quark-result/
          retention-days: 1
          if-no-files-found: ignore
