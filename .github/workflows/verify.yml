name: Verify Quark deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEX_CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verify encrypted state and reader failure handling
        run: node --test tests/*.test.cjs
      - name: Install and verify official runtime on a GitHub runner
        run: bash scripts/bootstrap.sh
      - name: Check official API connectivity and runtime channel
        run: |
          bash scripts/quark.sh resolve-agent
          curl --head --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /dev/null --write-out 'Official API HTTP status: %{http_code}\n' \
            https://open-api-drive.quark.cn/
