name: Quark account authorization
run-name: quark-auth:${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Generate an authorization link or complete binding
        type: choice
        options: [start, finish]
        default: start
        required: true
      request_id:
        description: Unique request identifier generated by the Agent
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: quark-drive-account
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEX_CI: '1'
      QUARK_RESULT_DIR: ${{ runner.temp }}/quark-result
    steps:
      - name: Require a private repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install official runtime
        run: bash scripts/bootstrap.sh
      - name: Get official authorization link
        if: inputs.action == 'start'
        run: node --use-env-proxy scripts/task.cjs authorize start
      - name: Complete official account binding
        if: inputs.action == 'finish'
        id: binding
        env:
          QUARK_AUTH_CODE: ${{ secrets.QUARK_AUTH_CODE }}
        run: node --use-env-proxy scripts/task.cjs authorize finish
      - name: Encrypt and persist account state
        if: inputs.action == 'finish' && steps.binding.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUARK_STATE_KEY: ${{ secrets.QUARK_STATE_KEY }}
        run: node --use-env-proxy scripts/state.cjs save
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quark-auth-${{ inputs.request_id }}
          path: ${{ runner.temp }}/quark-result/*.json
          retention-days: 1
          if-no-files-found: ignore
